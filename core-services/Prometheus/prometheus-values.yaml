prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: true
  tls:
    enabled: true

prometheus:
  prometheusSpec:
    replicas: 2
    externalLabels:
      cluster: "ve-promtheus-cluster"
      # NOTE: do NOT set a `replica` external label here. The "${REPLICA}"
      # template was never expanded (it landed literally as replica=""), which
      # is useless for HA dedup. The operator already injects a distinct
      # `prometheus_replica` external label per pod — that is what the Thanos
      # Querier deduplicates on (see core-services/Prometheus/Thanos/).
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-retain
          resources:
            requests:
              storage: 10Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: "2"
    livenessProbe:
      httpGet:
        path: /-/healthy
        port: 9090
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /-/healthy
        port: 9090
      initialDelaySeconds: 5
      periodSeconds: 5
    thanos:
      enabled: true
      version: v0.41.0   # pinned to match the standalone Thanos Querier
      # No objectStorageConfig: the `thanos-objstore-config` secret does not
      # exist, so the sidecar runs StoreAPI over each replica's LOCAL 7d TSDB
      # (enough for HA dedup). Long-term object storage is a separate effort —
      # re-add objectStorageConfig + a Store Gateway when that's wanted.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

# NOTE: kube-prometheus-stack has NO top-level `thanos.query` value — the old
# block here was silently ignored, which is why no Querier ever existed. The
# Querier is now a standalone Deployment in core-services/Prometheus/Thanos/.

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-retain
          resources:
            requests:
              storage: 2Gi

grafana:
  persistence:
    enabled: true
    storageClassName: longhorn-retain
    size: 10Gi
  # Grafana uses a single RWO (longhorn) PVC. The default RollingUpdate strategy
  # deadlocks on upgrades — the new pod can't attach the volume until the old one
  # terminates, but the old one won't terminate until the new one is Ready.
  # Recreate terminates the old pod first, so the volume hands off cleanly.
  deploymentStrategy:
    type: Recreate
  adminPassword: ChangeMe123!
  # Provisioning sidecars: the runtime POST to /api/admin/provisioning/.../reload
  # requires Grafana admin auth, and the persisted DB admin password no longer
  # matches this chart secret (it was changed post-install), so the reload 401s.
  # Make provisioning auth-independent instead of chasing the password:
  #  - datasources: load via an init container BEFORE Grafana starts (no reload
  #    needed at boot); skip the failing runtime reload. Runtime datasource edits
  #    then take effect on the next Grafana restart (clean, via Recreate above).
  #  - dashboards: Grafana's file provider already polls every 30s
  #    (updateIntervalSeconds), so they stay live without the reload API.
  sidecar:
    datasources:
      initDatasources: true
      # initDatasources replaces the runtime datasource sidecar with an init
      # container that uses sidecar.datasources.watchMethod for METHOD. The
      # default WATCH never exits, so the init container would block the pod
      # forever — it MUST be one-shot LIST so it loads datasources and exits,
      # then Grafana boots with them provisioned.
      watchMethod: LIST
      skipReload: true
    dashboards:
      skipReload: true
  serviceMonitor:
    enabled: true
  defaultDashboardsTimezone: UTC-6
  # Deduplicating query path across the HA Prometheus pair. Added as a
  # NON-default datasource: point long-range dashboards (e.g. the etcd
  # backup/defrag dashboard) at "Thanos" to avoid single-replica gaps.
  additionalDataSources:
    - name: Thanos
      type: prometheus
      access: proxy
      url: http://thanos-query.monitoring.svc.cluster.local:9090
      isDefault: false
      jsonData:
        timeInterval: 30s
  resources:
    requests:
      cpu: 250m
      memory: 750Mi
    limits:
      cpu: 500m
      memory: 1Gi
  pod:
    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 5

rbac:
  create: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
